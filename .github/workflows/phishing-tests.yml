name: Phishing extractor tests
on:
  push:
    paths:
      - 'phishing-email-investigation/**'
      - '.github/workflows/phishing-tests.yml'
  pull_request:
    paths:
      - 'phishing-email-investigation/**'
      - '.github/workflows/phishing-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extractor-tests:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run ten offline extraction checks
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & './phishing-email-investigation/Test-LabEmail.ps1'
