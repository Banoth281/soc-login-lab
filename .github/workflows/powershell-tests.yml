name: PowerShell detector tests

on:
  push:
    paths:
      - 'windows-event-investigation/powershell/**'
      - '.github/workflows/powershell-tests.yml'
  pull_request:
    paths:
      - 'windows-event-investigation/powershell/**'
      - '.github/workflows/powershell-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run eight synthetic detector tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & './windows-event-investigation/powershell/Test-RepeatedFailures.ps1'
